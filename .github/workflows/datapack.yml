name: Test Datapack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zip MF_datapack contents
        run: |
          cd MF_datapack
          zip -r ../MF_datapack.zip .

      - name: Setup Minecraft
        id: minecraft
        uses: ReinIsNOTaDev/setup-minecraft@v0.1.0
        with:
          version: "26.2"

      - uses: actions/setup-java@v3
        with:
          distribution: "microsoft"
          java-version: ${{ fromJson(steps.minecraft.outputs.package).javaVersion.majorVersion }}

      - name: Run Server
        timeout-minutes: 6
        run: |
          echo Running Minecraft ${{ steps.minecraft.outputs.version }}.
          cat <<EOF > server.properties
          initial-enabled-packs=vanilla,file/MF_datapack.zip
          EOF
          echo "eula=true" > eula.txt
          mkdir world
          cd world
          mkdir datapacks
          cd datapacks
          cp ../../MF_datapack.zip ./
          cd ../../
          nohup java -jar $MINECRAFT nogui&> server.log &
          sleep 1
          timeout 5m grep -Eq 'Done \([.[:digit:]]*s\)! For help, type "help"' <(tail -f server.log) || exit 1

      - name: Filter by errors
        if: ${{ !cancelled() }}
        run: grep -E '\[.*\/ERROR\]' server.log

      - name: Upload server logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          path: server.log
          archive: false

